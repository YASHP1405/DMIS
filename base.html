
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSE Department Portal</title>
<style>
body{font-family:Arial,sans-serif;margin:0;background:white;color:black;}
.top-margin{background:#5C0F8B;color:white;padding:20px;text-align:center;font-weight:bold;}
.start-button{display:inline-block;margin:10px;padding:12px 24px;background-color:lavender;color:black;text-decoration:none;border-radius:8px;transition:0.3s;font-weight:bold;}
.start-button:hover{background-color:thistle;transform:scale(1.05);}
input,select,button{padding:8px;width:100%;margin:5px 0;}
</style>
</head>
<body>
<div class="top-margin"><h1>CSE DEPARTMENT PORTAL</h1></div>
{% with messages = get_flashed_messages(with_categories=true) %}
{% if messages %}
{% for category,message in messages %}
<div style="color:{% if category=='danger'%}red{% else %}green{% endif %}; margin-bottom:10px;">{{ message }}</div>
{% endfor %}
{% endif %}
{% endwith %}
{% block content %}{% endblock %}
</body>
</html>
